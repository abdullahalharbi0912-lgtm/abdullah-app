<title>مساعد عبدالله</title>

<style>
/* الهوية: هادئة ومهنية. لون واحد للتفاعل (أزرق بحري)، حدود رفيعة بدل البطاقات والظلال، خط واحد.
   كل لون رمز. الداكن يعيد تعريف الرموز فقط. الأسماء القديمة (panel, reef, sand, coral) أسماء مستعارة للمساعد. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --ink: #0E1A24;
  --muted: #4F5D6B;
  --line: #DCE2E8;
  --line-strong: #B9C3CD;
  --accent: #0A4D68;
  --accent-ink: #FFFFFF;
  --accent-text: #0A4D68;
  --accent-soft: #E7F0F4;
  --ok: #176B3E;
  --warn: #8A5200;
  --bad: #AE2A1F;
  --ok-bg: #E2F3E9;
  --warn-bg: #FBEFD2;
  --bad-bg: #F9E0DD;
  /* أسماء مستعارة */
  --panel: var(--accent); --panel-ink: var(--accent-ink); --panel-muted: #BCD3DC;
  --reef: var(--accent); --reef-ink: var(--accent-text);
  --sand: var(--surface-2); --sand-ink: var(--ink);
  --coral: var(--accent); --coral-ink: var(--accent-ink);
  --f-display: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r-s: 6px; --r-m: 8px; --r-l: 12px;
  --gutter: max(20px, env(safe-area-inset-left, 0px));
  --gutter-e: max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1118; --surface: #111A23; --surface-2: #16212C; --ink: #E8EEF3; --muted: #9DAAB7; --line: #243140; --line-strong: #3A4A5B;
    --accent: #7CC4DC; --accent-ink: #06202B; --accent-text: #8FD0E6; --accent-soft: #12303D; --panel-muted: #14394A;
    --ok: #5FD296; --warn: #F2B95F; --bad: #FF8E80; --ok-bg: #12331F; --warn-bg: #3A2C0F; --bad-bg: #3D1814; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1118; --surface: #111A23; --surface-2: #16212C; --ink: #E8EEF3; --muted: #9DAAB7; --line: #243140; --line-strong: #3A4A5B;
  --accent: #7CC4DC; --accent-ink: #06202B; --accent-text: #8FD0E6; --accent-soft: #12303D; --panel-muted: #14394A;
  --ok: #5FD296; --warn: #F2B95F; --bad: #FF8E80; --ok-bg: #12331F; --warn-bg: #3A2C0F; --bad-bg: #3D1814; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.7;
  padding-inline: var(--gutter) var(--gutter-e); margin: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: 0; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .en { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.wrap { max-width: 1160px; margin-inline: auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* الأزرار */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px;
  border-radius: var(--r-s); border: 1px solid var(--ink); background: transparent; font-weight: 600; font-size: 16px; cursor: pointer;
  text-decoration: none; transition: background-color .15s ease, border-color .15s ease; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }

/* العلامة: الحرف ح في مربع بلون التفاعل */
.mark { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-m); background: var(--accent);
  color: var(--accent-ink); font-family: var(--f-display); font-weight: 700; font-size: 24px; line-height: 1; flex: none; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.brand b { font-weight: 700; font-size: 18px; line-height: 1.2; display: block; }
.brand small { color: var(--muted); font-size: 13px; display: block; line-height: 1.3; }

/* نماذج */
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
.in { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: var(--r-s); border: 1px solid var(--line-strong);
  background: var(--surface); font-weight: 400; font-size: 16px; }
textarea.in { min-height: 112px; resize: vertical; }
.in:focus-visible { border-color: var(--accent); outline-offset: 0; }
.chip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface-2); color: var(--ink); white-space: nowrap; border: 1px solid var(--line); }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.hide { display: none !important; }
.toast { position: fixed; inset-inline: var(--gutter) var(--gutter-e); inset-block-end: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto;
  max-width: 420px; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-m);
  z-index: 60; text-align: center; font-weight: 600; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }


/* ───── هوية التطبيق من صور عبدالله: أبيض الثوب، أحمر الشماغ، فحمي الاستوديو ─────
   الأحمر #872C45 من الشماغ نفسه، والفحمي من خلفية الاستوديو. التباين كله فوق AA، والذهبي للزخرفة فقط.
   مربعات الشماغ هي النمط الوحيد، وتظهر شريطاً رفيعاً لا خلفية.
   التصميم (ui-ux-pro-max): مسطح حديث، مسافات بشبكة ٨، أهداف لمس ٤٤+، بطاقة واحدة بارزة في كل شاشة. */
:root {
  --bg: #F5F4F1; --surface: #FFFFFF; --surface-2: #EFEDE9; --ink: #1D1D1F; --muted: #5A5B59;
  --line: #E4E1DC; --line-strong: #CBC7C0;
  --accent: #872C45; --accent-ink: #FFFFFF; --accent-text: #872C45; --accent-soft: #F6EBEE;
  --gold: #A8822E; --panel-muted: #E8D5DB; --charcoal: #1D1D1F; --charcoal-2: #2A2A2D;
  --check: repeating-conic-gradient(#872C45 0 25%, #FFFFFF 0 50%) 0 0 / 8px 8px;
  --r-m: 16px; --r-s: 12px; --r-l: 22px;
  --shadow: 0 1px 2px rgba(29,29,31,.05), 0 4px 14px rgba(29,29,31,.04);
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121213; --surface: #1C1C1E; --surface-2: #26262A; --ink: #EDEDEB; --muted: #A6A7A4; --line: #2C2C30; --line-strong: #45454A;
    --accent: #A3375A; --accent-ink: #FFFFFF; --accent-text: #EE9AB2; --accent-soft: #3A1E27; --panel-muted: #3A1E27; --gold: #C9A24A;
    --charcoal: #000000; --charcoal-2: #1C1C1E; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121213; --surface: #1C1C1E; --surface-2: #26262A; --ink: #EDEDEB; --muted: #A6A7A4; --line: #2C2C30; --line-strong: #45454A;
  --accent: #A3375A; --accent-ink: #FFFFFF; --accent-text: #EE9AB2; --accent-soft: #3A1E27; --panel-muted: #3A1E27; --gold: #C9A24A;
  --charcoal: #000000; --charcoal-2: #1C1C1E; --shadow: none;
}
body { font-size: 16px; line-height: 1.6; }
/* الشعار: «ح» أبيض على فحمي، وتحته شريط مربعات الشماغ */
.mark { background: #1D1D1F !important; color: #FFFFFF !important; position: relative; overflow: hidden; border-radius: 12px !important; }
.mark::after { content: ''; position: absolute; inset-inline: 22%; bottom: 14%; height: 12%; background: var(--check); background-size: 4px 4px; border-radius: 1px; }
.mark { padding-bottom: 10%; }
.lock-portrait { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--gold), 0 10px 30px rgba(0,0,0,.18); background: #4E4F4D; }
.lock-sig { font-size: 13px; color: var(--muted); letter-spacing: .3px; }
.lock-sig::before { content: ''; display: block; width: 44px; height: 6px; margin: 0 auto 8px; background: var(--check); background-size: 6px 6px; border-radius: 1px; }

/* ───── الإطار ───── */
body { padding-block-end: calc(92px + var(--nlb, 0px) + env(safe-area-inset-bottom, 0px)); }
.toast { inset-block-end: calc(96px + var(--nlb, 0px) + env(safe-area-inset-bottom, 0px)); border-radius: 999px; }
.sheet { padding-block-end: calc(24px + var(--nlb, 0px) + env(safe-area-inset-bottom, 0px)) !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.app { max-width: 640px; margin-inline: auto; }
header.top { position: sticky; inset-block-start: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px;
  margin-inline: calc(var(--gutter) * -1) calc(var(--gutter-e) * -1); padding-inline: var(--gutter) var(--gutter-e); }

const IND = '٠١٢٣٤٥٦٧٨٩';
const toIndic = v => String(v).replace(/[0-9]/g, d => IND[d]);
const toLatin = v => String(v)
  .replace(/[٠-٩]/g, d => String(IND.indexOf(d)))
  .replace(/[۰-۹]/g, d => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
// مبلغ: آلاف بفاصلة عربية صغيرة ٬ كما في SPEC (١٬٢٠٠)
const moneyAr = n => toIndic(Math.round(n).toLocaleString('en-US').replace(/,/g, '٬'));
const moneyEn = n => Math.round(n).toLocaleString('en-US');
// يقبل ١٢٠٠ أو 1,200 أو «١٬٢٠٠» ويعيد رقماً، وnull لغير الصالح (لا صفراً).
function toAmount(v) {
  if (v === null || v === undefined) return null;
  const s = toLatin(v).replace(/[,٬\s]/g, '').replace('٫', '.');
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}

// 05xxxxxxxx فقط. يقبل أرقاماً هندية ومسافات وشرطات و+966.
function normPhone(raw) {
  let s = toLatin(raw || '').replace(/[^\d+]/g, '');
  if (s.startsWith('+966')) s = '0' + s.slice(4);
  else if (s.startsWith('00966')) s = '0' + s.slice(5);
  else if (s.startsWith('966')) s = '0' + s.slice(3);
  else if (/^5\d{8}$/.test(s)) s = '0' + s;
  return /^05\d{8}$/.test(s) ? s : null;
}
const waLink = (phone, text) => {
  const p = normPhone(phone);
  if (!p) return null;
  return 'https://wa.me/966' + p.slice(1) + (text ? '?text=' + encodeURIComponent(text) : '');
};

/* ───── الوقت بتوقيت الرياض (UTC+3 بلا توقيت صيفي) ───── */
function riyadh(date = new Date()) {
  const t = new Date(date.getTime() + 3 * 3600 * 1000);
  return { dow: t.getUTCDay(), min: t.getUTCHours() * 60 + t.getUTCMinutes(),
           ymd: t.toISOString().slice(0, 10) };
}
const hm = (h, m = 0) => h * 60 + m;

const FRIDAY_FROM = hm(15, 30);

function inWindow(category, date = new Date()) {
  const c = CATEGORIES[category];
  if (!c) return false;
  const { dow, min } = riyadh(date);
  if (dow === 5 && min < FRIDAY_FROM) return false;

// hours_week: 7 مصفوفات، 0=الأحد، [فتح,إغلاق] أو [فتح1,إغلاق1,فتح2,إغلاق2]،
// ساعات عشرية (٩٫٥ = ٩:٣٠)، إغلاق فوق ٢٤ = بعد منتصف الليل، [0,0] = مغلق.
// الغائب (null) يعني «غير معروف»، فلا يحجب الإرسال.
function openStatus(hours, date = new Date()) {
  if (!Array.isArray(hours) || hours.length !== 7) return { known: false };
  const { dow, min } = riyadh(date);
  const spans = d => {
    const a = hours[d];
    if (!Array.isArray(a) || a.length < 2 || (a[0] === 0 && a[1] === 0)) return [];
    const out = [[a[0] * 60, a[1] * 60]];
    if (a.length >= 4) out.push([a[2] * 60, a[3] * 60]);
    return out;
  };
  const prev = spans((dow + 6) % 7).filter(s => s[1] > 1440).map(s => [s[0] - 1440, s[1] - 1440]);
  const all = [...prev, ...spans(dow)];
  const hit = all.find(s => min >= s[0] && min < s[1]);
  if (!hit) return { known: true, open: false, sinceOpen: 0 };
  return { known: true, open: true, sinceOpen: min - hit[0] };
}

function sendBlock(lead, now = new Date(), mode = 'demo') {
  if (lead.do_not_contact) return 'محجوب: تواصلنا معه سابقاً';
  if (lead.no_whatsapp) return 'الرقم بلا واتساب';
  if (FINAL_STAGES.includes(lead.stage)) return 'مرحلته نهائية';
  if (mode !== 'demo') { // الموقع والبروفايل لا يحتاجان نموذجاً لكل محل
    if (!['candidate', 'demo_ready'].includes(lead.stage)) return 'ليس مرشحاً للإرسال';
  } else {
    if (lead.stage !== 'demo_ready') return 'ليس في مرحلة «نموذج جاهز»';
  }
  if ((lead.log || []).some(e => e.dir === 'out' && e.kind === 'intro')) return 'أُرسل له من قبل';
  if (mode === 'demo' && !lead.demo_url) return 'لا رابط نموذج';
  if (!normPhone(lead.phone)) return 'جوال غير صالح';
  if (!inWindow(lead.category, now)) return 'خارج نافذة الفئة';
  const o = openStatus(lead.hours_week, now);
  if (o.known && (!o.open || o.sinceOpen < 60)) return 'المحل مغلق أو لم يمضِ ساعة على الافتتاح';
  return null;
}

// القرار لعبدالله: الوقت والحد اليومي والمهلة بين الرسائل نصائح تظهر له، لا موانع.
// المانع الوحيد ما يكسر قاعدة «رسالة واحدة لكل محل» أو لا يمكن معه الإرسال: محجوب، أُرسل له، مرحلته لا تسمح، بلا جوال، بلا رابط نموذج.
const TIME_REASONS = ['خارج نافذة الفئة', 'المحل مغلق أو لم يمضِ ساعة على الافتتاح'];
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function sendCheck(lead, leads, now = new Date(), mode = 'site', limit = DAILY_LIMIT) {
  const reason = sendBlock(lead, now, mode);
  if (reason && !TIME_REASONS.includes(reason)) return { ok: false, reason, tips: [] };
  const tips = [];
  if (reason === 'خارج نافذة الفئة' && CATEGORIES[lead.category]) { const w = CATEGORIES[lead.category].win; tips.push('خارج الوقت المقترح لفئته (' + hhmm(w[0]) + ' إلى ' + hhmm(w[1]) + ').'); }
  else if (reason) tips.push(reason + '.');
  const cap = Math.min(Number(limit) || DAILY_LIMIT, 20), used = sentTodayCount(leads || [], now);
  if (used >= cap) tips.push('أرسلت اليوم ' + used + '، والحد المقترح ' + cap + '. كثرة الرسائل من رقم جديد قد تعرّضه للحظر.');
  const wait = waitMinutes(leads || [], now);
  if (wait > 0) tips.push('آخر رسالة قبل أقل من ' + MIN_GAP_MIN + ' دقائق. التمهّل يحمي رقمك.');
  return { ok: true, reason: null, tips };
}
function waitMinutes(leads, now = new Date()) {
  let last = 0;
  for (const l of leads) for (const e of l.log || []) if (e.dir === 'out' && e.kind === 'intro') last = Math.max(last, new Date(e.at).getTime());
  return last ? Math.max(0, MIN_GAP_MIN - (now.getTime() - last) / 60000) : 0;
}

function sentTodayCount(leads, now = new Date()) {
  const today = riyadh(now).ymd;
  let n = 0;
  for (const l of leads) for (const e of l.log || [])
    if (e.dir === 'out' && e.kind === 'intro' && !e.outside && riyadh(new Date(e.at)).ymd === today) n++;
  return n;
}
function lastSentAt(leads) {
  let t = 0;
  for (const l of leads) for (const e of l.log || [])
    if (e.dir === 'out' && e.kind === 'intro') t = Math.max(t, new Date(e.at).getTime());
  return t || null;
}

// الطابور: من يُرسل له الآن. فارغ إن بلغ الحد أو لم تمضِ المهلة.
function sendQueue(leads, now = new Date(), mode = 'demo', limit = DAILY_LIMIT) {
  const used = sentTodayCount(leads, now);
  const left = Math.max(0, Math.min(Number(limit) || DAILY_LIMIT, 20) - used);
  const last = lastSentAt(leads);
  const waitMin = last ? Math.max(0, MIN_GAP_MIN - (now.getTime() - last) / 60000) : 0;
  const eligible = leads.filter(l => !sendBlock(l, now, mode));
  // ready: كل من يجوز الإرسال له، ولو خارج وقته. داخل الوقت أولاً ثم الأقوى. القرار لعبدالله.
  const ready = leads.filter(l => { const r = sendBlock(l, now, mode); return !r || TIME_REASONS.includes(r); })
    .sort((a, b) => (Number(!sendBlock(b, now, mode)) - Number(!sendBlock(a, now, mode))) || (leadScore(b).score - leadScore(a).score));
  return { used, left, waitMin, ready, eligible: left ? eligible : [], blockedReason: left ? null : 'بلغت الحد اليومي' };
}

/* ───── الإرسال المعلّق: يُسجَّل لحظة فتح واتساب، لا عند الرجوع ─────

   أو نُسي الزر، بقي المحل مرشحاً ورجع للطابور. الآن: الفتح نفسه يحجب ويسجّل، والتأكيد مجرد إقرار. */
const logAt = (lead, now, e) => (lead.log = lead.log || []).push({ at: now.toISOString(), ...e });
function markOpened(lead, { body = '', pdf = false, now = new Date() } = {}) {

  lead.pending_prev = lead.stage;
  lead.pending_at = now.toISOString();
  logAt(lead, now, { dir: 'out', kind: 'intro', body, pdf, pending: true });
  if (lead.stage !== 'sent') { lead.stage = 'sent'; logAt(lead, now, { kind: 'stage', stage: 'sent' }); }
  lead.do_not_contact = true;
  return true;
}
function confirmPending(lead, { pdf } = {}) {
  if (!lead || !lead.pending_at) return false;
  const e = (lead.log || []).find(x => x.pending && x.kind === 'intro');
  if (e) { delete e.pending; if (pdf) e.pdf = true; }
  delete lead.pending_at; delete lead.pending_prev;
  return true;
}
// «ما أرسلت»: يفكّ الحجب فقط لإرسال معلّق من اليوم نفسه. الحجب المؤكَّد لا يُفكّ أبداً.
function undoPending(lead, now = new Date()) {
  if (!lead || !lead.pending_at) return false;
  if (riyadh(new Date(lead.pending_at)).ymd !== riyadh(now).ymd) return false;
  const at = lead.pending_at;
  lead.log = (lead.log || []).filter(x => !(x.at === at && (x.pending || (x.kind === 'stage' && x.stage === 'sent'))));
  lead.stage = lead.pending_prev || 'candidate';
  lead.do_not_contact = false;
  delete lead.pending_at; delete lead.pending_prev;
  return true;
}
const pendingSends = leads => leads.filter(l => l.pending_at);
// أرسل له من خارج التطبيق (واتساب مباشرة أو نسخة قديمة): يُحجب ويُسجَّل، ولا يُحسب في حد اليوم.
function markSentOutside(lead, now = new Date()) {
  if (!lead || lead.example || lead.do_not_contact) return false;
  logAt(lead, now, { dir: 'out', kind: 'intro', outside: true });
  if (lead.stage !== 'sent') { lead.stage = 'sent'; logAt(lead, now, { kind: 'stage', stage: 'sent' }); }
  lead.do_not_contact = true;
  return true;
}

/* ───── الردود: ضغطة واحدة تسجّل الرد وتنقل المرحلة ───── */
const REPLY_KINDS = {
  interested: { ar: 'مهتم', stage: 'interested', reply: 'human' },
  human: { ar: 'يسأل', stage: 'human_reply', reply: 'human' },
  not_now: { ar: 'مو الحين', stage: 'not_now', reply: 'human' },
  rejected: { ar: 'رفض', stage: 'rejected', reply: 'human' },
  auto: { ar: 'آلي', stage: 'auto_reply', reply: 'auto' },
};
// المرحلة أولاً ثم الرد، فيكون آخر السجل «رد وارد» ويظهر في «ردود تنتظرك».
function recordReply(lead, kind, now = new Date()) {
  const k = REPLY_KINDS[kind];
  if (!lead || !k) return false;
  confirmPending(lead);
  if (lead.stage !== k.stage) { lead.stage = k.stage; logAt(lead, now, { kind: 'stage', stage: k.stage }); }
  logAt(lead, now, { dir: 'in', kind: 'reply', reply: k.reply, as: kind });
  lead.replyType = k.reply;
  lead.do_not_contact = true;                            // رد أو رفض: يبقى محجوباً عن أي رسالة أولى
  return true;
}
// بانتظار رد: أُرسل له أو رد آلياً. الأحدث إرسالاً أولاً.
function awaitingReply(leads) {
  const sentAt = l => { let t = 0; for (const e of l.log || []) if (e.dir === 'out' && e.kind === 'intro') t = Math.max(t, new Date(e.at).getTime()); return t; };
  return leads.filter(l => !l.example && ['sent', 'auto_reply'].includes(l.stage)).sort((a, b) => sentAt(b) - sentAt(a));
}

/* ───── الكوتيشن (SPEC القسم ٥) ───── */
const roundUp = (n, step = ROUND_TO) => Math.ceil(n / step) * step;

// مخصص: الساعات × ١٥٠ + التكاليف، مقرّب للأعلى لأقرب ٥٠٠، ولا يقل عن سعر الباقة.
function customTotal({ hours, costs = 0, floor = 0 }) {
  const h = toAmount(hours), c = toAmount(costs);
  if (h === null || c === null || h < 0 || c < 0) return null;
  return Math.max(floor, roundUp(h * HOURLY_RATE + c));
}

function paymentPlan(total, pcts) {
  const labelsShop = ['عند الاتفاق', 'عند التسليم'];
  const labelsBig = ['عند التوقيع', 'بعد اعتماد التصميم', 'عند التسليم'];
  const labels = pcts.length === 2 ? labelsShop : labelsBig;
  let paid = 0;
  return pcts.map((p, i) => {
    const amount = i === pcts.length - 1 ? total - paid : Math.round(total * p / 100);
    paid += amount;
    return { label: labels[i], pct: p, amount };
  });
}

function addDays(date, n) { return new Date(date.getTime() + n * 86400000); }

function makeQuote({ lead, pkg, hours, costs, now = new Date() }) {
  const p = PACKAGES.find(x => x.id === pkg);
  if (!p) return null;
  const custom = hours !== undefined && hours !== '' && hours !== null;
  let total = p.price;
  if (custom) {
    total = customTotal({ hours, costs, floor: p.price });
    if (total === null) return null;
  }
  return {
    id: 'q' + now.getTime().toString(36),
    lead_id: lead ? lead.id : null,
    package: pkg,
    hours: custom ? toAmount(hours) : null,
    hourly_rate: custom ? HOURLY_RATE : null,
    costs: custom ? toAmount(costs) || 0 : null,
    total,
    payment_terms: paymentPlan(total, p.deposit),
    valid_until: addDays(now, QUOTE_VALID_DAYS).toISOString().slice(0, 10),
    created: now.toISOString(),
    status: 'draft',
  };
}

// نص الكوتيشن الذي يصل العميل: أرقام هندية، بلا أي بند جبائي وبلا رقم حساب.
function quoteText(q, leadName = '') {
  const p = PACKAGES.find(x => x.id === q.package);
  const lines = [
    'السلام عليكم ورحمة الله',
    leadName ? `كوتيشن ${leadName}` : 'كوتيشن',
    `الباقة: ${p.ar.name}`,
    `الإجمالي: ${moneyAr(q.total)} ريال${p.fromPrice && q.hours === null ? ' (يبدأ من)' : ''}`,
    'الدفعات:',
    ...q.payment_terms.map(t => `- ${t.label}: ${moneyAr(t.amount)} ريال (${toIndic(t.pct)}%)`),
  ];
  if (p.days) lines.push(`التسليم خلال ${toIndic(p.days)} أيام عمل من استلام الصور والبيانات.`);
  lines.push(

    'الدومين يُسجَّل باسمكم وتدفعونه أنتم.');
  return lines.join('\n');
}

const FORBIDDEN_CLIENT_WORDS = ['فاتورة', 'ضريبة', 'ضريبية', 'شامل الضريبة', 'IBAN', 'آيبان', 'SA0', 'SA1', 'SA2', 'SA3', 'SA4', 'SA5', 'SA6', 'SA7', 'SA8', 'SA9'];
const clientTextIsClean = t => !FORBIDDEN_CLIENT_WORDS.some(w => t.includes(w));

const DELIVERY_CHECKLIST = [

];
const warrantyUntil = deliveredAt => addDays(new Date(deliveredAt), WARRANTY_DAYS).toISOString().slice(0, 10);

/* ───── الأرقام ───── */
const inRange = (iso, from, to) => { const t = new Date(iso).getTime(); return t >= from && t < to; };

function monthRevenue(leads, now = new Date()) {
  const ym = riyadh(now).ymd.slice(0, 7);
  let sum = 0;
  for (const l of leads) for (const p of l.payments || [])
    if (riyadh(new Date(p.at)).ymd.slice(0, 7) === ym) sum += Number(p.amount) || 0;
  return sum;
}

function stageCounts(leads) {
  const out = Object.fromEntries(STAGES.map(s => [s, 0]));
  for (const l of leads) if (out[l.stage] !== undefined) out[l.stage]++;
  return out;
}

function weekStats(leads, from, to) {
  const s = { sent: 0, read: 0, human_replies: 0, interested: 0, quotes: 0, won: 0, revenue: 0 };
  for (const l of leads) {
    for (const e of l.log || []) {
      if (e.dir === 'out' && e.kind === 'intro' && inRange(e.at, from, to)) {
        s.sent++;
        if (e.read === 'read') s.read++;
      }
      if (e.dir === 'in' && e.reply === 'human' && inRange(e.at, from, to)) s.human_replies++;
      if (e.kind === 'stage' && e.stage === 'interested' && inRange(e.at, from, to)) s.interested++;
      if (e.kind === 'stage' && e.stage === 'won' && inRange(e.at, from, to)) s.won++;
    }
    for (const q of l.quotes || []) if (q.status !== 'draft' && inRange(q.created, from, to)) s.quotes++;
    for (const p of l.payments || []) if (inRange(p.at, from, to)) s.revenue += Number(p.amount) || 0;
  }
  return s;
}

// ردود بشرية لم يُجب عليها بعد: آخر حدث في السجل رد بشري وارد.
function unansweredHuman(leads) {
  return leads.filter(l => {
    const log = l.log || [];
    const last = log[log.length - 1];
    return last && last.dir === 'in' && last.reply === 'human' && !FINAL_STAGES.includes(l.stage);
  });
}

// كل ٤٠ رسالة أولى بلا رد بشري: غيّر متغيراً واحداً.
function fortyAlert(leads) {
  const sent = [];
  for (const l of leads) for (const e of l.log || [])
    if (e.dir === 'out' && e.kind === 'intro') sent.push({ lead: l, at: new Date(e.at).getTime() });
  sent.sort((a, b) => a.at - b.at);
  const blocks = Math.floor(sent.length / ALERT_EVERY);
  if (!blocks) return { due: false, sent: sent.length, next: ALERT_EVERY - sent.length };
  const last = sent.slice((blocks - 1) * ALERT_EVERY, blocks * ALERT_EVERY);
  const human = last.filter(x => REPLIED.includes(x.lead.stage) && x.lead.replyType === 'human').length;
  return { due: human === 0, sent: sent.length, block: blocks, humanInBlock: human,
           next: ALERT_EVERY - (sent.length % ALERT_EVERY),
           text: 'غيّر شيئاً واحداً فقط: الوقت أو النص أو الفئة. ثم قِس ٤٠ رسالة أخرى.' };
}

/* ───── الاستيراد ───── */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const src = String(text).replace(/^﻿/, '');
  for (let i = 0; i < src.length; i++) {
    const ch = src[i];
    if (q) {
      if (ch === '"' && src[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') q = false;
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(c => c !== '')) rows.push(row);
      row = [];
    } else cur += ch;
  }
  row.push(cur);
  if (row.some(c => c !== '')) rows.push(row);
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

const MONTHS = { يناير: 1, فبراير: 2, مارس: 3, أبريل: 4, ابريل: 4, مايو: 5, يونيو: 6, يوليو: 7, أغسطس: 8, اغسطس: 8, سبتمبر: 9, أكتوبر: 10, اكتوبر: 10, نوفمبر: 11, ديسمبر: 12 };
// «أُرسل 3 نوفمبر» → 2026-11-03. الغامض يعيد null ولا يُخمَّن.
function parseSentDate(note, year = 2026) {
  const m = toLatin(note || '').match(/(\d{1,2})\s+(يناير|فبراير|مارس|أبريل|ابريل|مايو|يونيو|يوليو|أغسطس|اغسطس|سبتمبر|أكتوبر|اكتوبر|نوفمبر|ديسمبر)/);
  if (!m) return null;
  return `${year}-${String(MONTHS[m[2]]).padStart(2, '0')}-${String(Number(m[1])).padStart(2, '0')}`;
}

/* ───── مرونة الاستيراد: أعمدة عربية وإنجليزية من أي أداة تصدير، وتخمين الفئة ───── */
const HEADERS = {
  name: ['name', 'title', 'businessname', 'business', 'placename', 'الاسم', 'اسمالمحل', 'اسمالنشاط', 'المنشأة', 'المنشاة', 'اسمالمنشأة'],
  phone: ['phone', 'phonenumber', 'tel', 'telephone', 'mobile', 'mobilenumber', 'whatsapp', 'الجوال', 'الهاتف', 'رقمالجوال', 'رقمالهاتف', 'واتساب', 'رقمالتواصل'],
  alt_phone: ['altphone', 'phone2', 'secondaryphone', 'secondphone', 'جوال2', 'الجوالالبديل', 'هاتفآخر'],
  category: ['category', 'categories', 'type', 'maincategory', 'الفئة', 'التصنيف', 'النشاط', 'النوع'],
  district: ['district', 'neighborhood', 'neighbourhood', 'area', 'الحي', 'المنطقة'],
  city: ['city', 'town', 'المدينة'],
  address: ['address', 'fulladdress', 'العنوان'],
  rating: ['rating', 'stars', 'averagerating', 'totalscore', 'التقييم'],
  reviews: ['reviews', 'reviewscount', 'reviewcount', 'numberofreviews', 'userratingstotal', 'المراجعات', 'عددالمراجعات', 'عددالتقييمات'],
  website: ['website', 'site', 'url', 'web', 'الموقع', 'الموقعالإلكتروني', 'الموقعالالكتروني'],
  stage: ['stage', 'المرحلة'],
  demo_url: ['demourl', 'demo', 'رابطالنموذج'],
  demo_slug: ['demoslug'],
  batch: ['batch', 'الدفعة'],
  notes: ['notes', 'note', 'ملاحظات'],
  maps_url: ['mapsurl', 'googlemaps', 'checkurl', 'maplink', 'رابطالخريطة'],
  claimed: ['claimed', 'isclaimed'],
  source: ['source', 'المصدر'],
};
const hkey = h => String(h || '').replace(/^\uFEFF/, '').toLowerCase().replace(/[\s_\-.'"]/g, '');
const ALIAS = (() => { const m = new Map(); for (const [k, list] of Object.entries(HEADERS)) for (const a of list) m.set(a, k); return m; })();
function normalizeRow(raw) {
  const out = {};
  for (const [h, v] of Object.entries(raw)) {
    const k = ALIAS.get(hkey(h));
    if (k && (out[k] === undefined || out[k] === '')) out[k] = String(v ?? '').trim();
  }
  if (!out.district && out.address) { const m = out.address.match(/حي\s+([^,،\-–]+)/); if (m) out.district = m[1].trim(); }
  return out;
}
const WOMEN = /نسائي|نسائية|للنساء|سيدات|ladies|women|beauty|تجميل|سبا|spa\b/i;
const CAT_RULES = [
  ['carwash', /مغسلة\s*سيارات|غسيل\s*سيارات|car\s*wash|تلميع\s*سيارات/i],
  ['carpet', /سجاد|مفروشات|carpet|rug\b/i],
  ['barber', /حلاق|barber|صالون\s*رجال|men'?s\s*(salon|grooming)|قص\s*شعر/i],
  ['phones', /صيانة\s*(جوال|موبايل|هواتف)|جوالات|موبايلات|phone\s*repair|mobile\s*phone|cell\s*phone/i],
  ['flowers', /ورد|زهور|كوش|florist|flower/i],
  ['bakery', /مخبز|معجنات|bakery/i],
  ['sweets', /حلويات|كنافة|بقلاوة|sweet|dessert|confection|chocolate|candy/i],
  ['restaurant', /مطعم|مندي|مظبي|كبسة|شواء|مشويات|مطبخ|restaurant|grill|kitchen|cafe|كافيه/i],
  ['tailor', /خياط|تفصيل|tailor|ثياب|thobe/i],
  ['garage', /ورشة|ورش\s|ميكانيك|سمكرة|كهرباء\s*سيارات|تغيير\s*زيت|garage|auto\s*repair|car\s*repair|mechanic|tire|إطارات/i],
];
// يعيد مفتاح الفئة أو '' إن لم يعرف. لا يخمّن خارج القواعد.
function guessCategory(...texts) {
  const t = texts.filter(Boolean).join(' ');
  for (const [k, re] of CAT_RULES) if (re.test(t)) return k;
  return '';
}
const SOCIAL = /instagram\.com|facebook\.com|fb\.com|tiktok\.com|snapchat\.com|twitter\.com|x\.com|linktr\.ee|wa\.me|api\.whatsapp|t\.me|youtube\.com/i;
const hasRealWebsite = w => { const x = String(w || '').trim(); return !!x && !SOCIAL.test(x) && /\./.test(x); };

const https = u => /^https:\/\/[^\s"'<>]+$/.test(String(u || ''));
const CONTACTED_STAGES = ['sent', 'auto_reply', 'human_reply', 'interested', 'quoted', 'deposit', 'delivering', 'won', 'not_now', 'rejected'];

// يستورد صفوف CSV. المفتاح: الجوال. من تواصلنا معه يدخل بـ do_not_contact.
// existing: العملاء الحاليون. لا يُكرَّر أحد، ولا يُفكّ حجز أحد.
function importLeads(rows, existing = []) {
  const byPhone = new Map();
  for (const l of existing) {
    if (l.phone) byPhone.set(l.phone, l);
    if (l.alt_phone) byPhone.set(l.alt_phone, l);
  }
  const added = [], skipped = [], invalid = [], flagged = [];
  for (const raw of rows) {
    const r = normalizeRow(raw);
    if (!r.name) { invalid.push({ name: '(بلا اسم)', why: 'سطر بلا اسم محل' }); continue; }
    if (WOMEN.test(r.name + ' ' + (r.category || ''))) { invalid.push({ name: r.name, why: 'صالون أو نشاط نسائي: خارج الاستهداف' }); continue; }
    const phone = normPhone(r.phone);
    if (!phone) { invalid.push({ name: r.name, why: 'جوال لا يبدأ بـ 05 أو غير صالح' }); continue; }
    const alt = normPhone(r.alt_phone) || '';
    if (byPhone.has(phone) || (alt && byPhone.has(alt))) { skipped.push(r.name); continue; }
    let stage = STAGES.includes(r.stage) ? r.stage : 'candidate';
    const hasSite = hasRealWebsite(r.website);
    if (hasSite && !CONTACTED_STAGES.includes(stage)) stage = 'rejected';
    const contacted = CONTACTED_STAGES.includes(stage);
    const sentAt = contacted ? parseSentDate(r.notes) : null;
    const rating = Number(toLatin(r.rating)) || null;
    const reviews = Math.round(Number(toLatin(r.reviews))) || null;
    const lead = {
      id: 'l' + phone.slice(2),
      name: r.name, category: CATEGORIES[r.category] ? r.category : guessCategory(r.category, r.name), district: r.district || '', city: r.city || '',
      phone, alt_phone: alt, rating, reviews,
      demo_slug: r.demo_slug || '', demo_url: r.demo_url || '',
      hours_week: null, batch: Number(r.batch) || null,
      stage, notes: r.notes || '',
      website: r.website || '', address: r.address || '', maps_url: https(r.maps_url) ? r.maps_url : '', source: r.source || '',
      claimed: /^(true|1|yes|نعم)$/i.test(r.claimed || ''), tags: [],
      do_not_contact: contacted,
      replyType: stage === 'auto_reply' ? 'auto' : null,
      // سجل بلا تاريخ لا يُنشأ: لا يُحسب في «اليوم» ولا في كتل الأربعين. الحجب يكفيه do_not_contact.
      log: sentAt ? [{ dir: 'out', kind: 'intro', at: sentAt + 'T12:00:00+03:00', imported: true }] : [],
      quotes: [], payments: [],
    };
    // تحذير قواعد الاستهداف (SPEC القسم ٣). يُعلَّم فقط ولا يُحذف.
    const warn = [];
    if (!CATEGORIES[lead.category]) warn.push('فئة غير معروفة');
    if (hasSite) warn.push('عنده موقع');
    if (rating !== null && rating < 4.0) warn.push('تقييم أقل من ٤٫٠');
    if (reviews !== null && reviews < 300) warn.push('مراجعات أقل من ٣٠٠');
    if (warn.length) { lead.warnings = warn; flagged.push({ name: lead.name, warn }); }
    added.push(lead);
    byPhone.set(phone, lead);
    if (alt) byPhone.set(alt, lead);
  }
  return { added, skipped, invalid, flagged };
}

// إدخال سريع: كل سطر فيه جوال واسم. يقبل نصاً منسوخاً من خرائط Google. يعيد صفوفاً لـ importLeads.
// لا يخمّن اسماً: السطر بلا اسم بعد حذف الرقم يُرجَع في bad.
function parseQuickLines(text, defaultCategory = '') {
  const rows = [], bad = [];
  for (const line0 of String(text || '').split(/\r?\n/)) {
    const line = toLatin(line0).trim();
    if (!line) continue;
    const m = line.match(/(?:\+?966|00966)?[\s\-]*0?5(?:[\s\-]?\d){8}/);
    const phone = m ? normPhone(m[0].replace(/[\s\-]/g, '')) : null;
    const name = (m ? line.replace(m[0], ' ') : line).replace(/[|·•;,،:\-\u2013\u2014\t]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!phone) { bad.push({ line: line0.trim(), why: 'لا جوال سعودي يبدأ بـ 05' }); continue; }
    if (!name) { bad.push({ line: line0.trim(), why: 'لا اسم للمحل' }); continue; }
    rows.push({ name, phone, category: CATEGORIES[defaultCategory] ? defaultCategory : guessCategory(name), stage: 'candidate' });
  }
  return { rows, bad };
}

function restoreLeads(current, incoming) {
  const out = incoming.map(l => ({ ...l }));
  const byPhone = new Map();
  out.forEach(l => { if (l.phone) byPhone.set(l.phone, l); if (l.alt_phone) byPhone.set(l.alt_phone, l); });

  }
  return out;
}

  const r = Number(l.rating) || 0, v = Number(l.reviews) || 0;
  const pr = Math.round(Math.max(0, Math.min(1, r - 4)) * 30);
  const pv = v >= 300 ? Math.min(40, Math.round(40 * Math.log10(v / 300))) : 0;
  const social = /instagram|tiktok|snapchat|fresha|linktr|facebook|twitter|x\.com/i.test(l.website || '') ? 10 : 0;

  return { score: pr + pv + social + claimed + mobile, parts };
}

function addTag(l, tag) { const t = cleanTag(tag); if (!t) return false; l.tags = l.tags || []; if (l.tags.includes(t)) return false; if (l.tags.length >= 8) return false; l.tags.push(t); return true; }
function removeTag(l, tag) { l.tags = (l.tags || []).filter(x => x !== tag); }

// إجراء جماعي. لا يمسّ do_not_contact أبداً، ولا يسجّل رفضاً على من تواصلنا معه إلا إن طُلب صراحة.
function applyBulk(leads, ids, op, arg) {
  const set = new Set(ids); let n = 0;
  for (const l of leads) {
    if (!set.has(l.id)) continue;
    if (op === 'reject') { if (l.stage !== 'rejected') { l.stage = 'rejected'; (l.log = l.log || []).push({ kind: 'stage', stage: 'rejected', at: new Date().toISOString() }); n++; } }
    else if (op === 'tag') { if (addTag(l, arg)) n++; }
    else if (op === 'untag') { const b = (l.tags || []).length; removeTag(l, arg); if ((l.tags || []).length !== b) n++; }
  }
  return n;
}

    const r = riyadh(), sundayMs = Date.now() - r.dow * 86400e3 - (r.min * 60e3);
    const wk = (n) => [sundayMs - n * 7 * 86400e3, sundayMs - n * 7 * 86400e3 + 7 * 86400e3];
    const a = weekStats(real(), ...wk(0)), b = weekStats(real(), ...wk(1));
    const rows = [['أُرسل', 'sent'], ['مقروء', 'read'], ['رد بشري', 'human_replies'], ['مهتم', 'interested'], ['كوتيشن', 'quotes'], ['مغلق', 'won'], ['دخل', 'revenue']];
    const al = fortyAlert(real());
    return [exampleNote(), h('h1', { class: 'title' }, 'الأرقام'),
      h('section', { class: 'card' }, h('h2', null, 'الأسبوع'), h('div', { class: 'tw' }, h('table', { class: 'table' },
        h('thead', null, h('tr', null, h('th', null, h('span', { class: 'sr' }, 'البند')), h('th', { class: 'n' }, 'هذا الأسبوع'), h('th', { class: 'n' }, 'الماضي'))),
        h('tbody', null, rows.map(([lbl, k]) => h('tr', null, h('td', null, lbl), h('td', { class: 'n' }, a[k]), h('td', { class: 'n' }, b[k])))))),
        h('div', { class: 'muted' }, 'تحسب الأسبوع من الأحد. «مقروء» يظهر حين تعلّم الرسالة مقروءة، وهو غير معروف تلقائياً.')),
      h('section', { class: 'card' }, h('h2', null, 'قياس الأربعين'), h('div', { class: 'num' }, 'مرسل الكل: ' + al.sent + ' · الكتلة القادمة بعد ' + al.next + ' رسالة'),
        al.due ? h('div', { class: 'banner' }, al.text) : h('div', { class: 'muted' }, 'تغيّر متغيراً واحداً فقط (الوقت أو النص أو الفئة) عند كل تنبيه.')),
      h('section', { class: 'card' }, h('h2', null, 'دخل الشهر'), h('div', { class: 'big num' }, String(Math.round(monthRevenue(real())))), h('div', { class: 'muted num' }, 'من هدف ' + MONTH_TARGET + ' ريال. المحسوب فقط ما سجّلته دفعة.')),
      h('section', { class: 'card' }, h('h2', null, 'خط المبيعات'), h('div', { class: 'stagegrid' }, STAGES.map(s => h('div', null, h('span', { class: 'muted' }, STAGE_AR[s]), h('b', { class: 'num' }, stageCounts(S.leads)[s])))))];
  }

  /* ═════ الإعدادات: استيراد، نسخة، رابط الأعمال ═════ */
  function settingsSheet() {
    const result = h('div', { class: 'muted', style: 'white-space:pre-wrap' });
    const csvBox = h('textarea', { class: 'in code', id: 's-csv', placeholder: 'الصق محتوى CSV هنا، أو اختر الملف' });
    const doImport = text => {
      const rows = parseCSV(text);
      if (!rows.length) { result.textContent = 'الملف فارغ أو غير مقروء.'; return; }
      const wasExample = hasExamples();
      if (wasExample) S.leads = real();
      const r = importLeads(rows, real());
      S.leads = S.leads.concat(r.added);
      const locked = r.added.filter(l => l.do_not_contact).length;
      result.textContent = `أُضيف ${r.added.length}. محجوب لأننا كلمناه سابقاً ${locked}. مكرر تُرك ${r.skipped.length}. جوال غير صالح ${r.invalid.length}. خارج قواعد الاستهداف ${r.flagged.length}.` + (wasExample ? ' مُسحت بيانات المثال.' : '') + (r.invalid.length ? '\nاستُبعد:\n' + r.invalid.slice(0, 8).map(x => '- ' + x.name + ': ' + x.why).join('\n') + (r.invalid.length > 8 ? '\n... و ' + (r.invalid.length - 8) + ' أخرى' : '') : '');
      save(); renderTabs();
    };
    const fileIn = h('input', { type: 'file', id: 's-file', 'aria-label': 'ملف CSV', accept: '.csv,text/csv', class: 'in', onchange: e => {
      const f = e.target.files[0]; if (!f) return; const fr = new FileReader(); fr.onload = () => doImport(String(fr.result)); fr.readAsText(f, 'utf-8');
    } });
    const expBox = h('textarea', { class: 'in code', id: 's-exp', 'aria-label': 'تصدير CSV', readonly: true });
    const backBox = h('textarea', { class: 'in code', id: 's-bk', 'aria-label': 'النسخة الاحتياطية', readonly: true });
    const restoreBox = h('textarea', { class: 'in code', id: 's-rs', placeholder: 'الصق النسخة الاحتياطية هنا' });
    const works = h('input', { class: 'in', id: 's-works', dir: 'ltr', placeholder: 'https://...', value: S.settings.worksUrl || '' });
    // الرسالة الأولى: رابط الموقع الترحيبي أو نموذج لكل محل
    const sample = { name: 'مغسلة المثال', reviews: 812, demo_url: 'https://example.invalid/demo/' };
    const prevBox = h('div', { class: 'msg', dir: 'rtl' });
    const preview = () => { prevBox.textContent = firstMessage(sample, S.settings.mode, S.settings.siteUrl); };
    const modeSel = h('select', { class: 'in', id: 's-mode', 'aria-label': 'قالب الرسالة الأولى', onchange: e => { S.settings.mode = e.target.value; save(); preview(); renderTabs(); } },
      h('option', { value: 'site', selected: S.settings.mode === 'site' }, 'رابط الموقع الترحيبي (للقوائم الكبيرة)'),
      h('option', { value: 'pdf', selected: S.settings.mode === 'pdf' }, 'البروفايل PDF مع رابط الموقع'),
      h('option', { value: 'demo', selected: S.settings.mode === 'demo' }, 'نموذج جاهز لكل محل (المواصفة الأصلية)'));
    const limSel = h('select', { class: 'in', id: 's-lim', 'aria-label': 'الحد اليومي', onchange: e => { S.settings.dailyLimit = Number(e.target.value); save(); renderTabs(); toast('الحد اليومي ' + S.settings.dailyLimit); } },
      [5, 10, 15, 20].map(n => h('option', { value: n, selected: S.settings.dailyLimit === n }, 'الحد اليومي: ' + n + (n === 5 ? ' (تسخين)' : n === 10 ? ' (مواصفتك)' : n > 10 ? ' (خطر على الرقم)' : ''))));
    const siteIn = h('input', { class: 'in', id: 's-site', dir: 'ltr', 'aria-label': 'رابط الموقع', value: S.settings.siteUrl, placeholder: 'https://...' });
    preview();
    // القفل
    const lockMsg = h('div', { class: 'muted', role: 'status' });
    const p1 = h('input', { class: 'in', id: 's-pin', type: 'password', autocomplete: 'new-password', 'aria-label': 'رقم سري جديد', placeholder: 'رقم سري (٦ خانات فأكثر)' });
    const p2 = h('input', { class: 'in', id: 's-pin2', type: 'password', autocomplete: 'new-password', 'aria-label': 'تأكيد الرقم السري', placeholder: 'أعد كتابته' });
    const p0 = h('input', { class: 'in', id: 's-pin0', type: 'password', autocomplete: 'current-password', 'aria-label': 'الرقم السري الحالي', placeholder: 'الرقم السري الحالي' });
    const accountCard = cloudMode ? h('section', { class: 'card' }, h('h3', null, 'الحساب'),
      h('div', { class: 'chip ok' }, 'مسجّل: ' + ((Cloud.user && Cloud.user.user_metadata && Cloud.user.user_metadata.username) || 'abdullah')),
      h('div', { class: 'muted' }, 'بياناتك محفوظة في حسابك السحابي. لا يُحفظ شيء في هذا الجهاز. تخرج تلقائياً بعد ٥ دقائق في الخلفية.'),
      h('button', { class: 'btn', type: 'button', onclick: () => logout() }, 'خروج')) : null;
    const lockCard = cloudMode ? accountCard : vault
      ? h('section', { class: 'card' }, h('h3', null, 'قفل التطبيق'), h('div', { class: 'chip ok' }, 'مفعّل: البيانات مشفّرة في هذا الجهاز'),
          h('div', { class: 'muted' }, 'يُقفل تلقائياً بعد ٥ دقائق من تركه.'),
          h('button', { class: 'btn', type: 'button', onclick: () => lockNow() }, 'اقفل الآن'), p0,
          h('button', { class: 'btn sm', type: 'button', onclick: async () => { const e = await disableLock(p0.value); if (e) lockMsg.textContent = e; else { toast('أُلغي القفل'); settingsSheet(); } } }, 'ألغِ القفل'), lockMsg)
      : h('section', { class: 'card' }, h('h3', null, 'قفل التطبيق'),
          h('div', { class: 'muted' }, 'يشفّر بياناتك برقم سري، فلا يقرأها من يفتح جوالك. نسيان الرقم يعني فقد البيانات إلا من نسخة احتياطية.'),
          p1, p2, h('button', { class: 'btn primary', type: 'button', onclick: async () => { const e = await enableLock(p1.value, p2.value); if (e) lockMsg.textContent = e; else { toast('فُعّل القفل'); settingsSheet(); } } }, 'فعّل القفل'), lockMsg);
    sheet('الإعدادات',
      h('section', { class: 'card' }, h('h3', null, 'الرسالة الأولى'),
        h('div', { class: 'muted' }, 'رسالة واحدة لكل محل، بلا متابعة. أنت تضغط إرسال بنفسك.'),
        modeSel, limSel, h('label', { class: 'f', for: 's-site' }, 'رابط موقعك (https)', siteIn),
        h('div', { class: 'row start' }, h('button', { class: 'btn sm', type: 'button', onclick: () => { S.settings.siteUrl = normSiteUrl(siteIn.value); siteIn.value = S.settings.siteUrl; save(); preview(); toast('حُفظ'); } }, 'احفظ الرابط'),
          h('a', { class: 'btn sm', target: '_blank', rel: 'noopener', href: '#', onclick: e => { e.currentTarget.href = waLink(OWNER.phone, firstMessage(sample, S.settings.mode, S.settings.siteUrl)); } }, 'جرّب الرسالة على جوالك')),
        prevBox),
      lockCard,
      h('section', { class: 'card' }, h('h3', null, 'ثبّت التطبيق'),
        h('div', { class: 'muted' }, 'آيفون: افتح الرابط في Safari ثم زر المشاركة ثم «إضافة إلى الشاشة الرئيسية». أندرويد: قائمة Chrome ثم «تثبيت التطبيق».')),
      h('section', { class: 'card' }, h('h3', null, 'استيراد العملاء (CSV)'),
        h('div', { class: 'muted' }, 'يقبل ملفات الخرائط بأعمدة عربية أو إنجليزية: الاسم والجوال والفئة والتقييم والمراجعات. المفتاح الجوال: لا تكرار. يُستبعد النسائي ومن عنده موقع. من أُرسل له سابقاً يدخل محجوباً ولا يظهر في الطابور أبداً.'),
        copyBtn('الاسم,الفئة,الحي,الجوال,التقييم,المراجعات\nاسم المحل,مغسلة سيارات,الرحاب,05XXXXXXXX,4.6,812', 'انسخ قالب CSV'),
        fileIn, csvBox, h('button', { class: 'btn primary', type: 'button', onclick: () => doImport(csvBox.value) }, 'استورد'), result),
      h('section', { class: 'card' }, h('h3', null, 'رابط أعمالك'), h('div', { class: 'muted' }, 'يُرسل عند سؤال «أبغى أشوف شغلك». لا أضع رابطاً من عندي.'),
        works, h('button', { class: 'btn sm', type: 'button', onclick: () => { S.settings.worksUrl = works.value.trim(); save(); toast('حُفظ'); } }, 'احفظ')),
      h('section', { class: 'card' }, h('h3', null, 'تصدير العملاء (CSV)'), h('div', { class: 'muted' }, 'كل العملاء بمراحلهم وقوتهم ومهامهم. يُفتح في إكسل ويُستورد ثانية.'),
        expBox, h('div', { class: 'row start' }, h('button', { class: 'btn sm', type: 'button', onclick: () => { expBox.value = exportCsv(real()); expBox.select(); } }, 'أظهر'),
          h('button', { class: 'btn sm', type: 'button', onclick: () => {
            expBox.value = exportCsv(real()); expBox.select(); S.lastBackup = nowIso(); save();
            const done = () => toast('تم النسخ'), fall = () => toast('حُدِّد. انسخ يدوياً');
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(expBox.value).then(done, fall); else fall();
          } }, 'انسخ'))),
      cloudMode ? null : h('section', { class: 'card' }, h('h3', null, 'نسخة احتياطية'), h('div', { class: 'muted' }, 'بياناتك في هذا المتصفح فقط. انسخ نسخة بعد كل جلسة مهمة.'),
        backBox, h('div', { class: 'row start' }, h('button', { class: 'btn sm', type: 'button', onclick: () => { backBox.value = JSON.stringify({ ...S, leads: real() }); backBox.select(); S.lastBackup = nowIso(); save(); } }, 'أظهر النسخة'),
          h('button', { class: 'btn sm', type: 'button', onclick: () => {
            if (!backBox.value) backBox.value = JSON.stringify({ ...S, leads: real() });
            backBox.select(); S.lastBackup = nowIso(); save();
            const done = () => toast('تم النسخ'), fall = () => toast('حُدِّدت. انسخ يدوياً');
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(backBox.value).then(done, fall); else fall();
          } }, 'انسخ')),
        h('hr'), restoreBox, h('div', { class: 'muted' }, 'الاسترجاع لا يفكّ حجز أي محل محجوب.'),
        h('button', { class: 'btn sm', type: 'button', onclick: () => {
          try { const d = JSON.parse(restoreBox.value); if (!d || !Array.isArray(d.leads)) throw 0; S.leads = restoreLeads(real(), d.leads); S.settings = normalize({ settings: Object.assign({}, S.settings, d.settings || {}) }).settings; save(); toast('تم الاسترجاع'); render(); }
          catch (e) { toast('النسخة غير صالحة'); }
        } }, 'استرجع')));
  }

  const VIEW = { today: viewToday, send: viewSend, replies: viewReplies, leads: viewLeads, more: viewMore, quotes: viewQuotes, delivery: viewDelivery, stats: viewStats };

  $('#b-set').addEventListener('click', () => { if (S) settingsSheet(); });
  $('#b-theme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark'); if (!cloudMode) ls.set('asst.theme', dark ? 'light' : 'dark');
  });
  const th = cloudMode ? null : ls.get('asst.theme'); if (th) document.documentElement.setAttribute('data-theme', th);
  document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';

  // شارة Netlify: تظهر متأخرة بعد التحميل، فنراقب ظهورها ونقيس ارتفاعها الفعلي
  (function liftAboveBadge() {
    const set = () => {
      const f = document.getElementById('nl-badge-frame');
      const r = f && getComputedStyle(f).display !== 'none' ? f.getBoundingClientRect() : null;
      const lift = r && r.height > 0 && r.bottom >= innerHeight - 4 ? Math.ceil(innerHeight - r.top) + 4 : 0;
      document.documentElement.style.setProperty('--nlb', lift + 'px');
    };
    new MutationObserver(set).observe(document.body, { childList: true });
    addEventListener('resize', set);
    if ('ResizeObserver' in window) { const ro = new ResizeObserver(set); new MutationObserver(() => { const f = document.getElementById('nl-badge-frame'); if (f) ro.observe(f); }).observe(document.body, { childList: true }); }
    set(); setTimeout(set, 1500); setTimeout(set, 4000);
  })();
  function startUi() { tab = routeFromHash(); render(); }
  (function boot() {
    if (cloudMode) { try { localStorage.removeItem(KEY); localStorage.removeItem(LOCK_KEY); localStorage.removeItem('asst.theme'); } catch (e) { /* لا شيء */ } showLogin(); return; }
    let blob = null; try { blob = JSON.parse(ls.get(LOCK_KEY) || 'null'); } catch (e) { blob = null; }
    if (blob && blob.ct) { showLock(); return; }
    S = loadPlain(); startUi();
  })();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* غير مدعوم هنا */ } }
  setInterval(() => { if (tab === 'send' && !$('#sheet-root').children.length && !document.activeElement.closest('main')) render(); }, 20000);
})();
</script>
